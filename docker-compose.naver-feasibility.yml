name: coramail-agent-naver-feasibility

services:
  web:
    environment:
      CORAMAIL_ENV_FILE: /app/config/naver-feasibility.env
      CORAMAIL_MAIL_PROVIDER: naver
      CORAMAIL_RUNTIME_DIR: ${CORAMAIL_RUNTIME_DIR:-data/runtime/naver_feasibility}
      CORAMAIL_DATABASE_URL: postgresql://${CORAMAIL_POSTGRES_USER:-coramail}:${CORAMAIL_POSTGRES_PASSWORD:-coramail}@postgres:5432/${CORAMAIL_POSTGRES_DB:-coramail_naver_feasibility}
      CORAMAIL_QDRANT_CASE_COLLECTION: ${CORAMAIL_QDRANT_CASE_COLLECTION:-coramail_cases_naver_feasibility}
      GOOGLE_CREDENTIALS_JSON: ""
      GOOGLE_TOKEN_JSON: ""
      GOOGLE_SEND_TOKEN_JSON: ""
      CORAMAIL_NAVER_IMAP_HOST: ${CORAMAIL_NAVER_IMAP_HOST:-imap.naver.com}
      CORAMAIL_NAVER_IMAP_PORT: ${CORAMAIL_NAVER_IMAP_PORT:-993}
      CORAMAIL_NAVER_SMTP_HOST: ${CORAMAIL_NAVER_SMTP_HOST:-smtp.naver.com}
      CORAMAIL_NAVER_SMTP_PORT: ${CORAMAIL_NAVER_SMTP_PORT:-587}
      CORAMAIL_NAVER_MAIL_ADDRESS: ${CORAMAIL_NAVER_MAIL_ADDRESS:-}
      CORAMAIL_NAVER_IMAP_USERNAME: ${CORAMAIL_NAVER_IMAP_USERNAME:-}
      CORAMAIL_NAVER_APP_PASSWORD: ${CORAMAIL_NAVER_APP_PASSWORD:-}
      CORAMAIL_NAVER_MAX_RESULTS: ${CORAMAIL_NAVER_MAX_RESULTS:-0}
    volumes:
      - .:/app
      - coramail_naver_uv_cache:/root/.cache/uv

  bootstrap:
    environment:
      CORAMAIL_DATABASE_URL: postgresql://${CORAMAIL_POSTGRES_USER:-coramail}:${CORAMAIL_POSTGRES_PASSWORD:-coramail}@postgres:5432/${CORAMAIL_POSTGRES_DB:-coramail_naver_feasibility}
      CORAMAIL_QDRANT_CASE_COLLECTION: ${CORAMAIL_QDRANT_CASE_COLLECTION:-coramail_cases_naver_feasibility}

  postgres:
    volumes:
      - coramail_naver_postgres_data:/var/lib/postgresql/data

  qdrant:
    volumes:
      - coramail_naver_qdrant_data:/qdrant/storage

  ollama:
    volumes:
      - coramail_naver_ollama_data:/root/.ollama

  vllm-text:
    volumes:
      - coramail_naver_hf_cache:/root/.cache/huggingface

  vllm-embedding:
    volumes:
      - coramail_naver_hf_cache:/root/.cache/huggingface

volumes:
  coramail_naver_postgres_data:
    name: coramail_agent_naver_feasibility_postgres_data
  coramail_naver_qdrant_data:
    name: coramail_agent_naver_feasibility_qdrant_data
  coramail_naver_ollama_data:
    name: coramail_agent_naver_feasibility_ollama_data
  coramail_naver_hf_cache:
    name: coramail_agent_naver_feasibility_hf_cache
  coramail_naver_uv_cache:
    name: coramail_agent_naver_feasibility_uv_cache
