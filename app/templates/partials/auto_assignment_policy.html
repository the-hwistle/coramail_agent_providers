<section id="autoAssignmentPolicyPanel" class="settings-policy-form">
  {% if routing_policy_message %}
  <div class="inline-alert success">{{ routing_policy_message }}</div>
  {% endif %}
  {% if routing_policy_error %}
  <div class="inline-alert danger">{{ routing_policy_error }}</div>
  {% endif %}

  <form
    class="policy-grid"
    hx-post="/ui/settings/auto-assignment-policy"
    hx-target="#autoAssignmentPolicyPanel"
    hx-swap="outerHTML"
  >
    <label>
      <span>자동 배정 최소 점수</span>
      <input
        class="input"
        type="number"
        name="auto_assign_threshold"
        min="0"
        max="1"
        step="0.01"
        value="{{ '%.2f'|format(routing_policy.auto_assign_threshold) }}"
      >
    </label>
    <label>
      <span>1·2순위 최소 점수 차이</span>
      <input
        class="input"
        type="number"
        name="minimum_margin"
        min="0"
        max="1"
        step="0.01"
        value="{{ '%.2f'|format(routing_policy.minimum_margin) }}"
      >
    </label>
    <label>
      <span>업무유형 최소 신뢰도</span>
      <input
        class="input"
        type="number"
        name="minimum_classification_confidence"
        min="0"
        max="1"
        step="0.01"
        value="{{ '%.2f'|format(routing_policy.minimum_classification_confidence) }}"
      >
    </label>
    <button class="btn primary" type="submit">저장</button>
  </form>
</section>
