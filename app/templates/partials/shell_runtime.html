  <script>
    const isDemoDisplayMode = {{ demo_mode|default(false)|tojson }};
    const uiSyncState = {
      timer: null,
      view: "",
      versions: {},
      assetVersion: "{{ asset_version }}",
      attachmentOpen: {},
      classificationProgressTimer: null,
      classificationProgressUid: "",
      summaryProgressTimer: null,
      summaryProgressUid: "",
      attachmentProgressTimer: null,
      attachmentProgressUid: "",
      detailRequestUid: "",
      detailRequestNeedsVersionSync: false,
      manualRoutePollTimer: null,
    };
    const demoMainViewCache = {
      maxAgeMs: 30000,
      fragments: new Map(),
      inflight: new Map(),
    };
    const manualRouteConfirmState = {
      issueRequest: null,
      trigger: null,
    };
    const CHAT_SESSION_STORAGE_KEY = "coramail.chat.session_id";
    let copyToastTimer = null;

    function mainViewHistoryUrl(fragmentUrl) {
      const requestUrl = new URL(fragmentUrl || "/", window.location.origin);
      const historyUrl = new URL("/", window.location.origin);
      const viewByPath = {
        "/ui/dashboard": "dashboard",
        "/ui/inbox": "inbox",
        "/ui/monitoring": "monitoring",
        "/ui/ops": "ops",
        "/ui/assignees": "assignees",
        "/ui/my-work": "my-work",
        "/ui/documents": "documents",
        "/ui/search": "search",
        "/ui/chats": "chats",
        "/ui/settings": "settings",
      };
      const view = viewByPath[requestUrl.pathname] || "dashboard";
      if (view !== "dashboard") historyUrl.searchParams.set("view", view);
      ["q", "category", "limit", "email_index", "email_uid", "selected_email_uid", "assignee", "status", "session_id"].forEach(function (key) {
        const value = requestUrl.searchParams.get(key);
        if (value) historyUrl.searchParams.set(key, value);
      });
      return `${historyUrl.pathname}${historyUrl.search}`;
    }

    function safeChatSessionId(value) {
      const raw = String(value || "").trim();
      return /^[0-9a-fA-F-]{12,64}$/.test(raw) ? raw : "";
    }

    function storedChatSessionId() {
      try {
        return safeChatSessionId(window.localStorage ? window.localStorage.getItem(CHAT_SESSION_STORAGE_KEY) : "");
      } catch (error) {
        return "";
      }
    }

    function rememberChatSessionId(sessionId) {
      const safeSessionId = safeChatSessionId(sessionId);
      if (!safeSessionId) return "";
      try {
        if (window.localStorage) window.localStorage.setItem(CHAT_SESSION_STORAGE_KEY, safeSessionId);
      } catch (error) {
        return safeSessionId;
      }
      return safeSessionId;
    }

    function hydrateChatSessionInputs(root) {
      const scope = root && root.querySelectorAll ? root : document;
      scope.querySelectorAll("[data-chat-composer] #chatSessionInput").forEach(function (input) {
        const existing = safeChatSessionId(input.value);
        if (existing) {
          rememberChatSessionId(existing);
          return;
        }
        const stored = storedChatSessionId();
        if (stored) input.value = stored;
      });
    }

    function chatSessionUrl(url) {
      const requestUrl = new URL(url || "/", window.location.origin);
      if (!["/ui/chats", "/ui/chats-results"].includes(requestUrl.pathname)) {
        return `${requestUrl.pathname}${requestUrl.search}`;
      }
      const sessionId = storedChatSessionId();
      if (sessionId && !requestUrl.searchParams.get("session_id")) {
        requestUrl.searchParams.set("session_id", sessionId);
      }
      return `${requestUrl.pathname}${requestUrl.search}`;
    }

    function navButtonForPath(pathname) {
      return Array.from(document.querySelectorAll(".nav button[hx-post][hx-target='#main-panel']")).find(function (button) {
        return button.getAttribute("hx-post") === pathname;
      }) || null;
    }

    function mainViewPathForView(view) {
      const pathByView = {
        dashboard: "/ui/dashboard",
        inbox: "/ui/inbox",
        monitoring: "/ui/monitoring",
        assignees: "/ui/assignees",
        "my-work": "/ui/my-work",
        documents: "/ui/documents",
        "address-book": "/ui/address-book",
        search: "/ui/search",
        chats: "/ui/chats",
        settings: "/ui/settings",
      };
      return pathByView[view] || "";
    }

    function setActiveMainNav(button) {
      if (!button) return;
      document.querySelectorAll(".nav button").forEach(function (candidate) {
        candidate.classList.toggle("active", candidate === button);
      });
    }

    function showCopyToast(message) {
      const toast = document.querySelector("[data-copy-toast]");
      if (!toast) return;
      toast.textContent = message || "복사됐습니다.";
      toast.hidden = false;
      toast.classList.remove("is-visible");
      window.requestAnimationFrame(function () {
        toast.classList.add("is-visible");
      });
      if (copyToastTimer) window.clearTimeout(copyToastTimer);
      copyToastTimer = window.setTimeout(function () {
        toast.classList.remove("is-visible");
        window.setTimeout(function () {
          if (!toast.classList.contains("is-visible")) toast.hidden = true;
        }, 180);
      }, 1200);
    }

    async function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "0";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        if (!document.execCommand("copy")) throw new Error("copy command failed");
      } finally {
        textarea.remove();
      }
    }

    function setMainNavigationBusy(isBusy) {
      const target = document.getElementById("main-panel");
      if (!target) return;
      if (isBusy) {
        target.setAttribute("aria-busy", "true");
        return;
      }
      target.removeAttribute("aria-busy");
    }

    function installResponsiveHtmxControls(root) {
      const scope = root && root.querySelectorAll ? root : document;
      [
        ["#main-panel", "#main-panel:replace"],
        ["#email-detail", "#email-detail:replace"],
        ["#mailRows", "#mailRows:replace"],
        ["#opsRows", "#opsRows:replace"],
        ["#dashboardMailRows", "#dashboardMailRows:replace"],
        ["#opsInspector", "#opsInspector:replace"],
        ["#assigneeEmailDetailDrawer", "#assigneeEmailDetailDrawer:replace"],
      ].forEach(function (pair) {
        scope.querySelectorAll(`[hx-target='${pair[0]}'], [hx-target="${pair[0]}"]`).forEach(function (element) {
          if (!element.hasAttribute("hx-sync")) {
            element.setAttribute("hx-sync", pair[1]);
          }
        });
      });
    }

    function htmxTargetSelector(source) {
      if (!(source instanceof HTMLElement)) return "";
      const directTarget = source.getAttribute("hx-target");
      if (directTarget) return directTarget;
      const inherited = source.closest("[hx-target]");
      return inherited ? inherited.getAttribute("hx-target") || "" : "";
    }

    function htmxRequestPath(event) {
      return String(event.detail.path || event.detail.requestConfig?.path || "");
    }

    function setExclusiveActive(source, selector, groupSelector) {
      if (!(source instanceof HTMLElement) || !source.matches(selector)) return;
      const group = source.closest(groupSelector);
      if (!group) return;
      group.querySelectorAll(selector).forEach(function (candidate) {
        candidate.classList.toggle("is-active", candidate === source);
        if (candidate.hasAttribute("aria-pressed")) {
          candidate.setAttribute("aria-pressed", candidate === source ? "true" : "false");
        }
      });
    }

    function reflectImmediateHtmxState(event) {
      const source = event.detail.elt;
      if (!(source instanceof HTMLElement)) return;

      const targetSelector = htmxTargetSelector(source);
      if (targetSelector === "#main-panel") {
        const path = htmxRequestPath(event);
        const requestUrl = new URL(path || source.getAttribute("hx-get") || source.getAttribute("hx-post") || "/", window.location.origin);
        setActiveMainNav(navButtonForPath(requestUrl.pathname));
        setMainNavigationBusy(true);
        if (requestUrl.pathname === "/ui/inbox") {
          markInboxRowReadOptimistically(source.closest("#dashboardMailRows .clickable-row[data-email-uid]"));
        }
      }

      setExclusiveActive(source, ".ops-metric", ".ops-metrics");
      setExclusiveActive(source, ".assignee-work-stat", ".assignee-work-stats");
      setExclusiveActive(source, ".work-queue-item", ".work-queue-group");
      setExclusiveActive(source, ".assignee-roster-item", ".work-queue-assignees");

      if (targetSelector === "#email-detail") {
        const row = source.closest("#mailRows .clickable-row[data-email-index][data-email-uid]");
        if (row) {
          selectInboxRow(row);
          renderPendingInboxDetail(row);
        }
      }

      if (source.matches(".assignee-mail-table .clickable-row")) {
        source.closest("tbody")?.querySelectorAll(".clickable-row.is-selected").forEach(function (row) {
          row.classList.toggle("is-selected", row === source);
        });
      }
    }

    function activateMainView(url) {
      if (isDemoDisplayMode) {
        window.history.pushState({}, "", mainViewHistoryUrl(url));
      }
    }

    function showMainNavigationError(target, error) {
      target.innerHTML = `<section class="view page-view"><div class="panel"><div class="panel-body">화면을 불러오지 못했습니다: ${String(error.message || error)}</div></div></section>`;
      setMainNavigationBusy(false);
      syncPageTitle();
      syncTopbarActions();
      syncDashboardViewportMode();
    }

    function normalizeDemoMainViewUrl(url) {
      const requestUrl = new URL(url || "/", window.location.origin);
      return `${requestUrl.pathname}${requestUrl.search}`;
    }

    function demoMainViewNodesFromHtml(html) {
      const container = document.createElement("div");
      container.innerHTML = html || "";
      return Array.from(container.childNodes);
    }

    function cachedDemoMainViewEntry(url) {
      if (!isDemoDisplayMode) return "";
      const cached = demoMainViewCache.fragments.get(normalizeDemoMainViewUrl(url));
      if (!cached || Date.now() - cached.storedAt > demoMainViewCache.maxAgeMs) return null;
      return cached;
    }

    function cachedDemoMainView(url) {
      const cached = cachedDemoMainViewEntry(url);
      return cached ? cached.html || "" : "";
    }

    function storeDemoMainView(url, html, nodes) {
      if (!isDemoDisplayMode || !url || !html) return;
      demoMainViewCache.fragments.set(normalizeDemoMainViewUrl(url), {
        html,
        nodes: nodes || demoMainViewNodesFromHtml(html),
        storedAt: Date.now(),
      });
    }

    function cacheCurrentDemoMainView() {
      if (!isDemoDisplayMode) return;
      const target = document.getElementById("main-panel");
      const view = currentMainView();
      const path = mainViewPathForView(view);
      if (!target || !path) return;
      storeDemoMainView(path, target.innerHTML, Array.from(target.childNodes));
    }

    function clearDemoMainViewCache() {
      demoMainViewCache.fragments.clear();
      cacheCurrentDemoMainView();
    }

    function afterMainPanelHtmlApplied(target, url, options) {
      const deferHeavyWork = Boolean(options && options.deferHeavyWork);
      const runHeavyWork = function () {
        resizeEmailBodyFrames(target);
        initClassificationProgressForCurrentDetail();
        initSummaryProgressForCurrentDetail();
        initAttachmentProgressForCurrentDetail();
        initDashboardDistribution(target);
        initDashboardCategoryTimeline(target);
        initDashboardRoutingOverview(target);
      };
      activateMainView(url);
      limitInboxRows();
      syncInboxSelection();
      restoreAttachmentOpenState();
      initMonitoringColumns(document);
      initOpsInteractions(document);
      initAssigneeDetailDrawerInteractions(document);
      initChatEmailDrawerInteractions(document);
      updateMailStatusFilterButtons(target);
      updateCategoryFilterButtons(target);
      updateDashboardMailFilterButtons();
      applyDashboardMailStatFilter();
      syncPageTitle();
      syncTopbarActions();
      syncDashboardViewportMode();
      resetUiSync();
      scheduleManualRoutePoll(1500);
      cacheCurrentDemoMainView();
      if (deferHeavyWork) {
        window.requestAnimationFrame(function () {
          window.setTimeout(runHeavyWork, 0);
        });
      } else {
        runHeavyWork();
      }
    }

    function applyMainPanelHtml(target, html, url, options) {
      if (!target) return;
      storeAttachmentOpenState();
      cacheCurrentDemoMainView();
      const cached = options && options.cachedEntry ? options.cachedEntry : null;
      if (cached && cached.nodes && cached.nodes.length) {
        target.replaceChildren(...cached.nodes);
      } else {
        target.innerHTML = html;
      }
      if (options && options.deferHeavyWork) {
        activateMainView(url);
        syncPageTitle();
        syncTopbarActions();
        syncDashboardViewportMode();
        setMainNavigationBusy(false);
        window.requestAnimationFrame(function () {
          window.setTimeout(function () {
            afterMainPanelHtmlApplied(target, url, options);
            if (window.htmx && target.isConnected) htmx.process(target);
          }, 0);
        });
        return;
      }
      afterMainPanelHtmlApplied(target, url, options);
      if (window.htmx) {
        window.setTimeout(function () {
          if (target.isConnected) htmx.process(target);
        }, 0);
      }
    }

    function fetchDemoMainView(url, options) {
      if (!isDemoDisplayMode) return Promise.resolve("");
      const key = normalizeDemoMainViewUrl(url);
      if (demoMainViewCache.inflight.has(key)) return demoMainViewCache.inflight.get(key);
      const request = fetch(key, {
        method: "POST",
        headers: { "HX-Request": "true", Accept: "text/html" },
        cache: "no-store",
      })
        .then(function (response) {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then(function (html) {
          storeDemoMainView(key, html);
          if (options && options.refreshVisible && normalizeDemoMainViewUrl(mainViewPathForView(currentMainView())) === key) {
            const target = document.getElementById("main-panel");
            applyMainPanelHtml(target, html, key, {
              cachedEntry: cachedDemoMainViewEntry(key),
              deferHeavyWork: true,
            });
          }
          return html;
        })
        .catch(function (error) {
          console.warn("demo tab prefetch failed", error);
          return "";
        })
        .finally(function () {
          demoMainViewCache.inflight.delete(key);
        });
      demoMainViewCache.inflight.set(key, request);
      return request;
    }

    function prefetchDemoMainViews() {
      if (!isDemoDisplayMode) return;
      cacheCurrentDemoMainView();
      const buttons = Array.from(document.querySelectorAll(".nav button[hx-post][hx-target='#main-panel']"));
      buttons.forEach(function (button, index) {
        const url = button.getAttribute("hx-post") || "";
        if (!url || cachedDemoMainViewEntry(url)) return;
        window.setTimeout(function () {
          fetchDemoMainView(url);
        }, 150 + index * 220);
      });
    }

    function installDemoMainNavigationCache() {
      if (!isDemoDisplayMode) return;
      document.addEventListener("pointerenter", function (event) {
        const button = event.target.closest(".nav button[hx-post][hx-target='#main-panel']");
        if (!button) return;
        fetchDemoMainView(button.getAttribute("hx-post") || "");
      }, true);
      document.addEventListener("focusin", function (event) {
        const button = event.target.closest(".nav button[hx-post][hx-target='#main-panel']");
        if (!button) return;
        fetchDemoMainView(button.getAttribute("hx-post") || "");
      });
      document.addEventListener("click", function (event) {
        const button = event.target.closest(".nav button[hx-post][hx-target='#main-panel']");
        if (!button) return;
        const url = button.getAttribute("hx-post") || "";
        const cached = cachedDemoMainViewEntry(url);
        if (!cached || !cached.html) {
          fetchDemoMainView(url);
          return;
        }
        const target = document.querySelector(button.getAttribute("hx-target") || "#main-panel");
        if (!target) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        setActiveMainNav(button);
        setMainNavigationBusy(false);
        applyMainPanelHtml(target, cached.html, url, {
          cachedEntry: cached,
          deferHeavyWork: true,
        });
        fetchDemoMainView(url, { refreshVisible: true });
      }, true);
    }

    function loadMainViewWithoutHtmx(button) {
      const url = chatSessionUrl(button.getAttribute("hx-post"));
      const target = document.querySelector(button.getAttribute("hx-target") || "#main-panel");
      if (!url || !target) return;
      setActiveMainNav(button);
      setMainNavigationBusy(true);
      fetch(url, { method: "POST", headers: { "HX-Request": "true" } })
        .then(function (response) {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then(function (html) {
          applyMainPanelHtml(target, html, url);
        })
        .catch(function (error) {
          showMainNavigationError(target, error);
        })
        .finally(function () {
          setMainNavigationBusy(false);
        });
    }

    function installMainNavigation() {
      document.querySelectorAll(".nav button[hx-post][hx-target='#main-panel']").forEach(function (button) {
        button.addEventListener("click", function (event) {
          if (!window.htmx) {
            event.preventDefault();
            event.stopPropagation();
            loadMainViewWithoutHtmx(button);
            return;
          }
          setActiveMainNav(button);
          setMainNavigationBusy(true);
        });
      });
    }

    function installSearchFormFallback() {
      document.addEventListener("submit", function (event) {
        const form = event.target;
        if (!form || !form.matches || !form.matches("form.search-box")) return;
        if (window.htmx) return;

        const targetSelector = form.getAttribute("hx-target") || "#search-results";
        const target = document.querySelector(targetSelector);
        const results = document.querySelector("#search-results");
        if (form.matches("[data-chat-composer]")) hydrateChatSessionInputs(form);
        const url = new URL(chatSessionUrl(form.getAttribute("hx-get") || form.getAttribute("action") || "/ui/search-results"), window.location.origin);
        const formData = new FormData(form);
        for (const pair of formData.entries()) {
          url.searchParams.set(pair[0], pair[1]);
        }
        if (!target) return;

        event.preventDefault();
        const submitButton = form.querySelector("button[type='submit']");
        if (submitButton) submitButton.disabled = true;
        renderChatPendingState(form);
        target.setAttribute("aria-busy", "true");
        if (results) results.classList.add("is-loading");
        fetch(url.toString(), { headers: { "HX-Request": "true" } })
          .then(function (response) {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text();
          })
          .then(function (html) {
            target.innerHTML = html;
            syncChatSessionInputFromResponse(form, target);
            playChatTurnEnter(target);
          })
          .catch(function (error) {
            if (form.matches("[data-chat-composer]")) {
              renderChatErrorState(form, `대화 결과를 불러오지 못했습니다: ${String(error.message || error)}`);
            } else {
              target.innerHTML = `<div class="notice danger">검색 결과를 불러오지 못했습니다: ${String(error.message || error)}</div>`;
            }
          })
          .finally(function () {
            target.removeAttribute("aria-busy");
            if (results) results.classList.remove("is-loading");
            if (submitButton) submitButton.disabled = false;
          });
      });
    }

    function reducedMotionPreferred() {
      return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function playMotionEnter(element) {
      if (!element || reducedMotionPreferred()) return;
      element.classList.remove("motion-enter");
      window.requestAnimationFrame(function () {
        element.classList.add("motion-enter");
      });
    }

    function playSideDrawerEnter(element) {
      if (!element || reducedMotionPreferred()) return;
      element.classList.remove("side-drawer-enter");
      void element.offsetWidth;
      element.classList.add("side-drawer-enter");
    }

    function playChatTurnEnter(target) {
      if (!target || reducedMotionPreferred()) return;
      const conversations = target.querySelectorAll(".chat-conversation, .chat-empty");
      const latest = conversations[conversations.length - 1];
      if (latest) {
        if (latest.classList.contains("chat-empty") || latest.classList.contains("chat-conversation-pending")) {
          playMotionEnter(latest);
          return;
        }
        const latestNodes = latest.querySelectorAll(".chat-message-user, .chat-message-group-assistant");
        const startIndex = Math.max(0, latestNodes.length - 2);
        for (let index = startIndex; index < latestNodes.length; index += 1) {
          playMotionEnter(latestNodes[index]);
        }
        return;
      }
      const messageNodes = target.querySelectorAll(".chat-message, .chat-message-group");
      const lastMessage = messageNodes[messageNodes.length - 1];
      if (lastMessage) playMotionEnter(lastMessage);
    }

    function chatResultsBodyForForm(form) {
      if (!form || !form.matches || !form.matches("[data-chat-composer]")) return null;
      const targetSelector = form.getAttribute("hx-target") || "#chat-results-body";
      return document.querySelector(targetSelector);
    }

    function chatComposerForSource(source) {
      if (!source || !source.matches) return null;
      if (source.matches("[data-chat-composer]")) return source;
      const view = source.closest(".chats-view");
      return view ? view.querySelector("[data-chat-composer]") : document.querySelector("[data-chat-composer]");
    }

    function scrollChatThreadToBottom(form) {
      const target = chatResultsBodyForForm(form);
      const thread = target ? target.closest("[data-chat-thread]") : null;
      if (!thread) return;
      thread.scrollTop = thread.scrollHeight;
    }

    function syncChatSessionInputFromResponse(form, target) {
      if (!form || !target || !form.matches("[data-chat-composer]")) return;
      const nextInput = target.querySelector("#chatSessionInput");
      const currentInput = form.querySelector("#chatSessionInput");
      if (nextInput && currentInput) {
        currentInput.value = nextInput.value || currentInput.value || "";
        rememberChatSessionId(currentInput.value);
        nextInput.remove();
      }
      const nextHistoryInput = target.querySelector("#chatHistoryInput");
      const currentHistoryInput = form.querySelector("#chatHistoryInput");
      if (nextHistoryInput && currentHistoryInput) {
        currentHistoryInput.value = nextHistoryInput.value || "[]";
        nextHistoryInput.remove();
      }
    }

    function renderChatPendingState(form, queryOverride) {
      const target = chatResultsBodyForForm(form);
      if (!target) return;
      const input = form.querySelector("[name='q']");
      const query = String(queryOverride || (input ? input.value : "") || "").trim();
      if (!query) return;
      form.dataset.chatPendingQuery = query;
      const template = document.getElementById("chatPendingTemplate");
      if (!template || !template.content) return;
      target.querySelectorAll(".chat-conversation-pending").forEach(function (node) {
        node.remove();
      });
      target.querySelectorAll(".chat-empty").forEach(function (node) {
        node.remove();
      });
      const fragment = template.content.cloneNode(true);
      const queryNode = fragment.querySelector("[data-chat-pending-query]");
      if (queryNode) queryNode.textContent = query;
      target.appendChild(fragment);
      if (input) input.value = "";
      playChatTurnEnter(target);
      scrollChatThreadToBottom(form);
    }

    function renderChatErrorState(form, message) {
      const target = chatResultsBodyForForm(form);
      if (!target) return;
      const input = form.querySelector("[name='q']");
      const query = String((form.dataset.chatPendingQuery || (input ? input.value : "")) || "").trim();
      const wrapper = document.createElement("div");
      wrapper.className = "chat-conversation";
      if (query) {
        const userMessage = document.createElement("div");
        userMessage.className = "chat-message chat-message-user";
        const userBubble = document.createElement("div");
        userBubble.className = "chat-bubble";
        userBubble.textContent = query;
        userMessage.appendChild(userBubble);
        wrapper.appendChild(userMessage);
      }
      const group = document.createElement("div");
      group.className = "chat-message-group chat-message-group-assistant";
      const assistantMessage = document.createElement("div");
      assistantMessage.className = "chat-message chat-message-assistant";
      const avatar = document.createElement("div");
      avatar.className = "chat-avatar";
      avatar.setAttribute("aria-hidden", "true");
      avatar.textContent = "AI";
      const bubble = document.createElement("div");
      bubble.className = "chat-bubble chat-error-bubble";
      const strong = document.createElement("strong");
      strong.textContent = message;
      bubble.appendChild(strong);
      assistantMessage.appendChild(avatar);
      assistantMessage.appendChild(bubble);
      group.appendChild(assistantMessage);
      wrapper.appendChild(group);
      target.replaceChildren(wrapper);
      playMotionEnter(wrapper);
      scrollChatThreadToBottom(form);
    }

    function installSearchExamples() {
      document.addEventListener("click", function (event) {
        const button = event.target && event.target.closest ? event.target.closest("[data-search-example]") : null;
        if (!button) return;
        const query = button.dataset.searchExample || "";
        const inputSelector = button.dataset.searchInput || "#searchQueryInput";
        const input = document.querySelector(inputSelector);
        const form = input ? input.closest("form.search-box") : null;
        if (!input || !form || !query) return;
        event.preventDefault();
        input.value = query;
        input.dispatchEvent(new Event("input", { bubbles: true }));
      });
    }

    function limitInboxRows() {
      const wrap = document.querySelector(".inbox-table-wrap");
      if (!wrap) return;
      wrap.style.removeProperty("height");

      const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      if (!viewportHeight) return;

      const header = wrap.querySelector("thead");
      const sampleRow = wrap.querySelector("#mailRows .clickable-row");
      const headerHeight = header ? Math.ceil(header.getBoundingClientRect().height) : 0;
      const rowHeight = sampleRow ? Math.ceil(sampleRow.getBoundingClientRect().height) : 0;
      const rowsVisibleAroundSelection = 6;
      const rowsBasedHeight = rowHeight ? headerHeight + rowHeight * rowsVisibleAroundSelection + 2 : 0;
      const viewportBasedHeight = Math.round(Math.min(Math.max(viewportHeight * 0.44, 420), 680));
      const preferredHeight = rowsBasedHeight || viewportBasedHeight;
      wrap.style.height = `${preferredHeight}px`;
    }

    function centerInboxRow(row, wrap) {
      if (!row || !wrap) return;

      const wrapRect = wrap.getBoundingClientRect();
      const rowRect = row.getBoundingClientRect();
      const header = wrap.querySelector("thead");
      const headerHeight = header ? Math.ceil(header.getBoundingClientRect().height) : 0;
      const currentScrollTop = wrap.scrollTop;
      const rowTop = rowRect.top - wrapRect.top + currentScrollTop;
      const rowCenter = rowTop + row.offsetHeight / 2;
      const visibleHeight = wrap.clientHeight - headerHeight;
      wrap.scrollTo({
        top: Math.max(rowCenter - headerHeight - visibleHeight / 2, 0),
        behavior: "smooth",
      });
    }

    function selectInboxRow(row) {

      if (selectedInput) selectedInput.value = row.dataset.emailIndex || "";
      if (selectedUidInput) selectedUidInput.value = row.dataset.emailUid || "";

      document.querySelectorAll("#mailRows .clickable-row[data-email-uid]").forEach(function (candidate) {
        candidate.classList.toggle("is-selected", candidate === row);
      });
      markInboxRowReadOptimistically(row);
      centerInboxRow(row, document.querySelector(".inbox-table-wrap"));

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, function (character) {
        return ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[character] || character;
      });
    }

    function setClassificationProgress(card, percent, label, caption, failed) {
      if (!card) return;
      const progress = card.querySelector("[data-classification-progress]");
      if (!progress) return;

      const boundedPercent = Math.max(0, Math.min(100, Math.round(percent)));
      const fill = progress.querySelector("[data-classification-progress-fill]");
      const value = progress.querySelector("[data-classification-progress-value]");
      const labelNode = progress.querySelector("[data-classification-progress-label-node]");
      const captionNode = progress.querySelector("[data-classification-progress-caption-node]");
      const track = progress.querySelector("[data-classification-progress-track]");

      progress.classList.add("is-active");
      progress.classList.toggle("is-failed", Boolean(failed));
      if (fill) fill.style.width = `${boundedPercent}%`;
      if (value) value.textContent = failed ? "실패" : `${boundedPercent}%`;
      if (labelNode && label) labelNode.textContent = label;
      if (captionNode && caption) captionNode.textContent = caption;
      if (track) track.setAttribute("aria-valuenow", String(boundedPercent));
    }

    function syncDocumentsViewportLayout() {
      const view = document.querySelector('.document-types-view');
      const grid = view ? view.querySelector('.document-type-card-grid') : null;
      if (!view || !grid) return;

      const cards = Array.from(grid.querySelectorAll('.document-type-card'));
      if (!cards.length) return;

      const gap = Number.parseFloat(window.getComputedStyle(grid).gap || "0") || 0;
      const gridWidth = grid.clientWidth;
      const minColumnWidth = window.innerWidth <= 640 ? 150 : window.innerWidth <= 1180 ? 220 : 248;
      const columnCount = Math.max(1, Math.floor((gridWidth + gap) / (minColumnWidth + gap)));
      const rowCount = Math.max(1, Math.ceil(cards.length / columnCount));
      const cardHeight = Math.max(72, Math.floor((grid.clientHeight - gap * (rowCount - 1)) / rowCount));

      grid.style.setProperty("--document-card-height", `${cardHeight}px`);
      grid.style.gridTemplateRows = `repeat(${rowCount}, minmax(0, var(--document-card-height)))`;
    }

    const documentTypeIconOptions = [
      "request_quote",
      "price_check",
      "receipt_long",
      "payments",
      "article",
      "description",
      "inventory_2",
      "fact_check",
      "contract",
      "assignment",
    ];

    function documentTypeIconStorageKey(documentType) {
      return `coramail.documentTypeIcon.${documentType}`;
    }

    function storedDocumentTypeIcon(documentType) {
      try {
        return window.localStorage.getItem(documentTypeIconStorageKey(documentType));
      } catch (error) {
        return "";
      }
    }

    function storeDocumentTypeIcon(documentType, icon) {
      try {
        window.localStorage.setItem(documentTypeIconStorageKey(documentType), icon);
      } catch (error) {
        return;
      }
    }

    function defaultDocumentTypeIcon(documentType) {
      const icon = documentTypeIconOptions[Math.floor(Math.random() * documentTypeIconOptions.length)];
      storeDocumentTypeIcon(documentType, icon);
      return icon;
    }

    function setDocumentTypeIcon(card, icon) {
      const display = card.querySelector("[data-document-type-icon]");
      if (display) display.textContent = icon;
      card.querySelectorAll(".document-type-icon-option").forEach((button) => {
        button.classList.toggle("is-selected", button.dataset.documentIcon === icon);
      });
    }

    function initDocumentTypeIconPickers(root) {
      const scope = root || document;
      const cards = scope.matches && scope.matches(".document-type-card")
        ? [scope]
        : Array.from(scope.querySelectorAll(".document-type-card"));
      cards.forEach((card) => {
        const documentType = card.dataset.documentType || "";
        if (!documentType) return;
        let icon = storedDocumentTypeIcon(documentType);
        if (!documentTypeIconOptions.includes(icon)) {
          icon = defaultDocumentTypeIcon(documentType);
        }
        setDocumentTypeIcon(card, icon);
      });
    }

    function monitoringColumnStorageKey() {
      return "coramail.monitoring.visibleColumns.v1";
    }

    function monitoringColumnWidthStorageKey() {
      return "coramail.monitoring.columnWidths.v1";
    }

    function monitoringColumnOrderStorageKey() {
      return "coramail.monitoring.columnOrder.v1";
    }

    function monitoringColumnOrderDefaults() {
      return [
        "health",
        "subject",
        "sender",
        "business",
        "assignee",
        "received",
        "attachment",
        "summary",
        "classification",
        "decision",
        "routing",
        "forwarding",
      ];
    }

    function monitoringColumnDefaults() {
      return {
        health: true,
        subject: true,
        sender: true,
        business: true,
        assignee: true,
        received: true,
        attachment: true,
        summary: true,
        classification: true,
        decision: true,
        routing: true,
        forwarding: true,
        control: true,
      };
    }

    function monitoringColumnWidthDefaults() {
      return {
        health: 64,
        subject: 450,
        sender: 82,
        business: 112,
        assignee: 138,
        received: 116,
        attachment: 150,
        summary: 150,
        classification: 150,
        decision: 184,
        routing: 150,
        forwarding: 150,
      };
    }

    function readMonitoringColumns() {
      const defaults = monitoringColumnDefaults();
      try {
        const raw = window.localStorage ? window.localStorage.getItem(monitoringColumnStorageKey()) : "";
        const parsed = raw ? JSON.parse(raw) : {};
        return Object.assign({}, defaults, parsed || {});
      } catch (_) {
        return defaults;
      }
    }

    function saveMonitoringColumns(columns) {
      try {
        if (window.localStorage) {
          window.localStorage.setItem(monitoringColumnStorageKey(), JSON.stringify(columns));
        }
      } catch (_) {}
    }

    function readMonitoringColumnWidths() {
      const defaults = monitoringColumnWidthDefaults();
      try {
        const raw = window.localStorage ? window.localStorage.getItem(monitoringColumnWidthStorageKey()) : "";
        const parsed = raw ? JSON.parse(raw) : {};
        const widths = Object.assign({}, defaults);
        Object.keys(parsed || {}).forEach(function (key) {
          const width = Number(parsed[key]);
          if (Number.isFinite(width)) {
            widths[key] = Math.max(48, Math.min(720, Math.round(width)));
          }
        });
        return widths;
      } catch (_) {
        return defaults;
      }
    }

    function saveMonitoringColumnWidths(widths) {
      try {
        if (window.localStorage) {
          window.localStorage.setItem(monitoringColumnWidthStorageKey(), JSON.stringify(widths));
        }
      } catch (_) {}
    }

    function readMonitoringColumnOrder() {
      const defaults = monitoringColumnOrderDefaults();
      try {
        const raw = window.localStorage ? window.localStorage.getItem(monitoringColumnOrderStorageKey()) : "";
        const parsed = raw ? JSON.parse(raw) : [];
        const known = new Set(defaults);
        const ordered = Array.isArray(parsed)
          ? parsed.filter(function (key) { return known.has(key) && key !== "health"; })
          : [];
        defaults.forEach(function (key) {
          if (key !== "health" && ordered.indexOf(key) === -1) {
            ordered.push(key);
          }
        });
        return ["health"].concat(ordered);
      } catch (_) {
        return defaults;
      }
    }

    function saveMonitoringColumnOrder(order) {
      try {
        if (window.localStorage) {
          window.localStorage.setItem(monitoringColumnOrderStorageKey(), JSON.stringify(order));
        }
      } catch (_) {}
    }

    function applyMonitoringColumnOrder(view) {
      if (!view) return;
      const table = view.querySelector(".ops-table");
      if (!table) return;
      const order = readMonitoringColumnOrder();
      const appendOrdered = function (parent, selector) {
        if (!parent) return;
        order.forEach(function (key) {
          const node = parent.querySelector(selector + "[data-monitoring-column='" + key + "']");
          if (node) {
            parent.appendChild(node);
          }
        });
      };
      appendOrdered(table.querySelector("colgroup"), "col");
      appendOrdered(table.querySelector("thead tr"), "th");
      table.querySelectorAll("tbody tr").forEach(function (row) {
        appendOrdered(row, "td");
      });
    }

    function applyMonitoringColumnWidths(view) {
      if (!view) return;
      const table = view.querySelector(".ops-table");
      if (!table) return;
      const visibleColumns = readMonitoringColumns();
      const widths = readMonitoringColumnWidths();
      let visibleWidth = 0;
      table.querySelectorAll("col[data-monitoring-column]").forEach(function (col) {
        const key = col.getAttribute("data-monitoring-column") || "";
        const width = widths[key];
        if (width) {
          col.style.width = width + "px";
          col.style.minWidth = width + "px";
        }
        if (visibleColumns[key] !== false && width) {
          visibleWidth += width;
        }
      });
      if (visibleWidth > 0) {
        const wrap = table.closest(".ops-table-wrap");
        const frameWidth = wrap ? Math.floor(wrap.clientWidth) : 0;
        table.style.width = Math.max(visibleWidth, frameWidth) + "px";
        table.style.minWidth = visibleWidth + "px";
      }
    }

    function updateMonitoringTerminalColumn(view) {
      if (!view) return;
      const headers = Array.prototype.slice.call(view.querySelectorAll("th[data-monitoring-column]"));
      headers.forEach(function (header) {
        header.classList.remove("is-terminal-visible-column");
      });
      const visibleHeaders = headers.filter(function (header) {
        return !header.hidden;
      });
      const terminalHeader = visibleHeaders[visibleHeaders.length - 1];
      if (terminalHeader) {
        terminalHeader.classList.add("is-terminal-visible-column");
      }
    }

    function monitoringColumnWidthBounds(key) {
      return {
        min: key === "subject" ? 180 : key === "health" ? 48 : 72,
        max: key === "subject" ? 720 : 360,
      };
    }

    function nextVisibleMonitoringColumnKey(header) {
      let next = header ? header.nextElementSibling : null;
      while (next) {
        if (next.matches && next.matches("th[data-monitoring-column]") && !next.hidden) {
          return next.getAttribute("data-monitoring-column") || "";
        }
        next = next.nextElementSibling;
      }
      return "";
    }

    function applyMonitoringColumns(root) {
      const scope = root && root.querySelector ? root : document;
      const columns = readMonitoringColumns();
      const view = scope.matches && scope.matches(".ops-view[data-view='monitoring']")
        ? scope
        : scope.querySelector(".ops-view[data-view='monitoring']");
      applyMonitoringColumnOrder(view);
      scope.querySelectorAll("[data-monitoring-column]").forEach(function (node) {
        const key = node.getAttribute("data-monitoring-column") || "";
        node.hidden = columns[key] === false;
      });
      scope.querySelectorAll("[data-monitoring-column-toggle]").forEach(function (input) {
        const key = input.getAttribute("data-monitoring-column-toggle") || "";
        input.checked = columns[key] !== false;
      });
      applyMonitoringColumnWidths(view);
      updateMonitoringTerminalColumn(view);
    }

    function initMonitoringColumnResize(view) {
      const table = view ? view.querySelector(".ops-table") : null;
      if (!table) return;
      view.querySelectorAll("[data-monitoring-column-resizer]").forEach(function (handle) {
        if (handle.dataset.monitoringColumnResizeBound) return;
        handle.dataset.monitoringColumnResizeBound = "true";
        handle.addEventListener("pointerdown", function (event) {
          if (event.button !== undefined && event.button !== 0) return;
          const key = handle.getAttribute("data-monitoring-column-resizer") || "";
          const header = handle.closest("th[data-monitoring-column]");
          const col = table.querySelector("col[data-monitoring-column='" + key + "']");
          if (header && header.classList.contains("is-terminal-visible-column")) return;
          if (!key || !header || !col) return;
          const nextKey = nextVisibleMonitoringColumnKey(header);
          const nextCol = nextKey ? table.querySelector("col[data-monitoring-column='" + nextKey + "']") : null;
          if (!nextKey || !nextCol) return;
          event.preventDefault();
          event.stopPropagation();
          const startX = event.clientX;
          const startWidth = col.getBoundingClientRect().width || header.getBoundingClientRect().width;
          const nextStartWidth = nextCol.getBoundingClientRect().width || startWidth;
          const widths = readMonitoringColumnWidths();
          const bounds = monitoringColumnWidthBounds(key);
          const nextBounds = monitoringColumnWidthBounds(nextKey);
          table.classList.add("is-column-resizing");
          header.classList.add("is-resizing");
          if (handle.setPointerCapture) {
            try { handle.setPointerCapture(event.pointerId); } catch (_) {}
          }
          const onMove = function (moveEvent) {
            const rawDelta = Math.round(moveEvent.clientX - startX);
            const minDelta = Math.max(bounds.min - startWidth, nextStartWidth - nextBounds.max);
            const maxDelta = Math.min(bounds.max - startWidth, nextStartWidth - nextBounds.min);
            const delta = Math.max(minDelta, Math.min(maxDelta, rawDelta));
            widths[key] = Math.round(startWidth + delta);
            widths[nextKey] = Math.round(nextStartWidth - delta);
            saveMonitoringColumnWidths(widths);
            applyMonitoringColumnWidths(view);
          };
          const onEnd = function () {
            table.classList.remove("is-column-resizing");
            header.classList.remove("is-resizing");
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onEnd);
            window.removeEventListener("pointercancel", onEnd);
          };
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onEnd);
          window.addEventListener("pointercancel", onEnd);
        });
      });
    }

    function initMonitoringColumnReorder(view) {
      const table = view ? view.querySelector(".ops-table") : null;
      if (!table) return;
      view.querySelectorAll("th[data-monitoring-column]").forEach(function (header) {
        if (header.dataset.monitoringColumnReorderBound) return;
        header.dataset.monitoringColumnReorderBound = "true";
        header.addEventListener("pointerdown", function (event) {
          if (event.button !== undefined && event.button !== 0) return;
          if (event.target && event.target.closest(".ops-column-resizer, button, a, input, select, summary, details, label")) return;
          const key = header.getAttribute("data-monitoring-column") || "";
          if (!key || key === "health") return;
          let longPressTimer = 0;
          let active = false;
          let currentOrder = readMonitoringColumnOrder();
          const startX = event.clientX;
          const startY = event.clientY;
          const clearLongPress = function () {
            if (longPressTimer) {
              window.clearTimeout(longPressTimer);
              longPressTimer = 0;
            }
          };
          const activate = function () {
            active = true;
            table.classList.add("is-column-reordering");
            header.classList.add("is-reordering");
          };
          const onMove = function (moveEvent) {
            if (!active) {
              const moved = Math.abs(moveEvent.clientX - startX) + Math.abs(moveEvent.clientY - startY);
              if (moved > 8) {
                clearLongPress();
              }
              return;
            }
            moveEvent.preventDefault();
            const target = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY);
            const targetHeader = target ? target.closest("th[data-monitoring-column]") : null;
            const targetKey = targetHeader ? targetHeader.getAttribute("data-monitoring-column") || "" : "";
            if (!targetKey || targetKey === "health" || targetKey === key) return;
            const fromIndex = currentOrder.indexOf(key);
            const toIndex = currentOrder.indexOf(targetKey);
            if (fromIndex <= 0 || toIndex <= 0 || fromIndex === toIndex) return;
            currentOrder.splice(fromIndex, 1);
            currentOrder.splice(toIndex, 0, key);
            saveMonitoringColumnOrder(currentOrder);
            applyMonitoringColumns(view);
          };
          const onEnd = function () {
            clearLongPress();
            if (active) {
              table.classList.remove("is-column-reordering");
              view.querySelectorAll("th.is-reordering").forEach(function (node) {
                node.classList.remove("is-reordering");
              });
              saveMonitoringColumnOrder(currentOrder);
            }
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onEnd);
            window.removeEventListener("pointercancel", onEnd);
          };
          if (header.setPointerCapture) {
            try { header.setPointerCapture(event.pointerId); } catch (_) {}
          }
          longPressTimer = window.setTimeout(activate, 320);
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onEnd);
          window.addEventListener("pointercancel", onEnd);
        });
      });
    }

    function resizeEmailBodyFrames(root) {
      const scope = root && root.querySelectorAll ? root : document;
      scope.querySelectorAll(".email-body-frame").forEach(function (frame) {
        function applyHeight() {
          try {
            const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
            if (!doc) return;
            const body = doc.body;
            const html = doc.documentElement;
            if (body) body.style.overflow = "hidden";
            if (html) html.style.overflow = "hidden";
            frame.style.height = "auto";
            const height = Math.max(
              body ? body.scrollHeight : 0,
              body ? body.offsetHeight : 0,
              html ? html.scrollHeight : 0,
              html ? html.offsetHeight : 0,
            );
            if (height > 0) frame.style.height = `${height + 8}px`;
          } catch (_) {}
        }
        if (frame.dataset.bodyFrameResizeBound !== "true") {
          frame.dataset.bodyFrameResizeBound = "true";
          frame.addEventListener("load", applyHeight);
        }
        try {
          const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
          const body = doc && doc.body;
          if (body && frame.dataset.bodyFrameResizeObserved !== "true" && "ResizeObserver" in window) {
            frame.dataset.bodyFrameResizeObserved = "true";
            const observer = new ResizeObserver(applyHeight);
            observer.observe(body);
          }
        } catch (_) {}
        applyHeight();
        window.setTimeout(applyHeight, 80);
        window.setTimeout(applyHeight, 300);
      });
    }

    function parseDashboardChartData(rawValue, fallback) {
      if (!rawValue) return fallback;

        return fallback;
      }

    function ensureDashboardChartsReady() {

      const chartScript = document.getElementById("chartjs-cdn");

        chartScript.dataset.dashboardRetryBound = "true";
        chartScript.addEventListener("load", function () {

          initDashboardCategoryTimeline(document);

    function initDashboardDistribution(root) {
      const scope = root && root.querySelector ? root : document;
      const section = scope.querySelector("[data-dashboard-distribution]");
      if (!section) return;

      if (!ensureDashboardChartsReady()) {
        return;
      }

      const canvas = section.querySelector("#categoryDonut");
      const center = section.querySelector("#donutCenter");
      const donutTooltip = section.querySelector("#categoryDonutTooltip");
      if (!canvas) return;

      if (window.categoryDonutChart) {
        window.categoryDonutChart.destroy();
        window.categoryDonutChart = null;
      }

      const categories = parseDashboardChartData(section.dataset.chartCategories, []);
      const counts = parseDashboardChartData(section.dataset.chartCounts, {});
      const palette = parseDashboardChartData(section.dataset.chartPalette, []);
      const total = Number(section.dataset.chartTotal || 0);
      const data = categories.map(function (category) {
        return Number(counts[category] || 0);
      });
      const neutralCenterColor = "#000000";
      const categoryColorMap = categories.reduce(function (acc, category, index) {
        acc[category] = palette[index] || neutralCenterColor;
        return acc;
      }, {});

      function syncDonutCenter(label, value, color) {
        if (!center) return;

        const strong = center.querySelector("strong");
        const span = center.querySelector("span");
        if (!strong || !span) return;

        strong.textContent = `${value}건`;
        strong.style.color = color || neutralCenterColor;
        span.textContent = label;
        span.style.color = color || neutralCenterColor;
      }

      function hideDonutTooltip() {
        if (!donutTooltip) return;

        donutTooltip.classList.remove("is-visible");
        donutTooltip.setAttribute("aria-hidden", "true");
      }

      function renderDonutTooltip(context) {
        if (!donutTooltip) return;

        const tooltip = context.tooltip;
        if (!tooltip || tooltip.opacity === 0 || !tooltip.dataPoints || tooltip.dataPoints.length === 0) {
          hideDonutTooltip();
          return;
        }

        const point = tooltip.dataPoints[0];
        const value = Number(point.parsed || 0);
        const currentTotal = Number(section.dataset.chartTotal || 0);
        const pct = currentTotal ? Math.round(value / currentTotal * 100) : 0;
        const label = point.label || "";

        donutTooltip.replaceChildren();
        const title = document.createElement("strong");
        title.textContent = label;
        const detail = document.createElement("span");
        detail.textContent = `${value}건 (${pct}%)`;
        donutTooltip.append(title, detail);

        const canvasRect = context.chart.canvas.getBoundingClientRect();
        const centerX = canvas.offsetLeft + canvas.offsetWidth / 2;
        const centerY = canvas.offsetTop + canvas.offsetHeight / 2;
        const caretX = canvas.offsetLeft + (tooltip.caretX || canvas.width / 2) * (canvasRect.width / context.chart.width);
        const caretY = canvas.offsetTop + (tooltip.caretY || canvas.height / 2) * (canvasRect.height / context.chart.height);
        const dy = caretY - centerY;

        donutTooltip.classList.add("is-visible");
        donutTooltip.setAttribute("aria-hidden", "false");

        const tooltipWidth = donutTooltip.offsetWidth;
        const edgeGap = 8;
        const minLeft = edgeGap + tooltipWidth / 2;
        const maxLeft = donutTooltip.parentElement.offsetWidth - edgeGap - tooltipWidth / 2;
        const left = Math.min(Math.max(caretX, minLeft), maxLeft);
        const top = dy >= 0
          ? donutTooltip.parentElement.offsetHeight - edgeGap
          : edgeGap;
        const transform = dy >= 0 ? "translate(-50%, -100%)" : "translate(-50%, 0)";

        donutTooltip.style.left = `${left}px`;
        donutTooltip.style.top = `${top}px`;
        donutTooltip.style.transform = transform;
      }

      syncDonutCenter("전체", total, neutralCenterColor);

      window.categoryDonutChart = new Chart(canvas, {
        type: "doughnut",
        data: {
          labels: categories,
          datasets: [{
            data: data,
            backgroundColor: palette.slice(0, categories.length),
            borderColor: "#ffffff",
            borderWidth: 4,
            hoverOffset: 8,
            spacing: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: "72%",
          radius: "92%",
          animation: {
            duration: 600,
            easing: "easeOutQuart"
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              enabled: false,
              displayColors: false,
              external: renderDonutTooltip,
              callbacks: {
                label: function (ctx) {
                  const value = ctx.parsed || 0;
                  const currentTotal = Number(section.dataset.chartTotal || 0);
                  const pct = currentTotal ? Math.round(value / currentTotal * 100) : 0;
                  return ` ${ctx.label}: ${value}건 (${pct}%)`;
                }
              }
            }
          },
          onHover: function (_, elements) {
            if (elements.length > 0) {
              const hoveredIndex = elements[0].index;
              const hoveredCategory = categories[hoveredIndex];
              const currentData = window.categoryDonutChart ? window.categoryDonutChart.data.datasets[0].data : data;
              syncDonutCenter(hoveredCategory, currentData[hoveredIndex] || 0, categoryColorMap[hoveredCategory]);
              return;
            }

            syncDonutCenter(
              window.dashboardDistributionScope === "all" ? "전체" : "오늘",
              Number(section.dataset.chartTotal || 0),
              neutralCenterColor
            );
          }
        }
      });

      function applyDistributionScope(nextScope) {
        const scopeName = nextScope === "all" ? "all" : "today";
        window.dashboardDistributionScope = scopeName;
        const scopedCounts = parseDashboardChartData(
          scopeName === "all" ? section.dataset.chartCountsAll : section.dataset.chartCountsToday,
          {}
        );
        const scopedTotal = Number(
          scopeName === "all" ? section.dataset.chartTotalAll || 0 : section.dataset.chartTotalToday || 0
        );
        const scopedData = categories.map(function (category) {
          return Number(scopedCounts[category] || 0);
        });

        section.dataset.chartCounts = JSON.stringify(scopedCounts);
        section.dataset.chartTotal = String(scopedTotal);

        if (window.categoryDonutChart) {
          window.categoryDonutChart.data.datasets[0].data = scopedData;
          window.categoryDonutChart.update();
        }
        syncDonutCenter(scopeName === "all" ? "전체" : "오늘", scopedTotal, neutralCenterColor);

        section.querySelectorAll("[data-dashboard-distribution-list]").forEach(function (list) {
          list.classList.toggle("is-hidden", list.dataset.dashboardDistributionList !== scopeName);
        });
        section.querySelectorAll("[data-dashboard-distribution-scope]").forEach(function (button) {
          const isActive = button.dataset.dashboardDistributionScope === scopeName;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
      }

      section.querySelectorAll("[data-dashboard-distribution-scope]").forEach(function (button) {
        button.addEventListener("click", function () {
          applyDistributionScope(button.dataset.dashboardDistributionScope || "today");
        });
      });
      applyDistributionScope(window.dashboardDistributionScope || "today");
    }

    function initDashboardCategoryTimeline(root) {
      const scope = root && root.querySelector ? root : document;
      const section = scope.querySelector("[data-dashboard-category-timeline]");
      if (!section) return;

      window.categoryTimelineState = window.categoryTimelineState || {
        hiddenCategories: {}
      };

      if (window.categoryTimelineChart) {
        window.categoryTimelineChart.destroy();
        window.categoryTimelineChart = null;
      }

      if (!ensureDashboardChartsReady()) {
        return;
      }

      const categories = parseDashboardChartData(section.dataset.chartCategories, []);
      const palette = parseDashboardChartData(section.dataset.chartPalette, []);
      const timelineLabels = parseDashboardChartData(section.dataset.chartTimelineLabels, []);
      const timelineDatasets = parseDashboardChartData(section.dataset.chartTimelineDatasets, {});
      const timelineCanvas = section.querySelector("#categoryTimeline");

      if (!timelineCanvas || !timelineLabels.length) {
        return;
      }

      function syncTimelineLegendButtons() {
        section.querySelectorAll("[data-timeline-category-toggle]").forEach(function (button) {
          const category = button.dataset.timelineCategoryToggle || "";
          const isVisible = !window.categoryTimelineState.hiddenCategories[category];
          button.classList.toggle("is-inactive", !isVisible);
          button.setAttribute("aria-pressed", isVisible ? "true" : "false");
        });
      }

      const timelineSeries = categories.map(function (category, index) {
        return {
          label: category,
          data: Array.isArray(timelineDatasets[category]) ? timelineDatasets[category] : [],
          backgroundColor: `${palette[index]}33`,
          borderColor: palette[index],
          borderWidth: 1.5,
          borderRadius: 0,
          borderSkipped: false,
          maxBarThickness: 18,
          categoryPercentage: 0.7,
          barPercentage: 0.9
        };
      });

      window.categoryTimelineChart = new Chart(timelineCanvas, {
        type: "bar",
        data: {
          labels: timelineLabels,
          datasets: timelineSeries
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          layout: {
            padding: { left: 0, right: 8, top: 6, bottom: 0 }
          },
          scales: {
            x: {
              stacked: false,
              grid: {
                display: false,
                drawBorder: false
              },
              ticks: {
                color: "#526273",
                font: {
                  size: 13,
                  weight: 700
                }
              }
            },
            y: {
              beginAtZero: true,
              ticks: {
                precision: 0,
                color: "#7a8796",
                font: {
                  size: 11
                }
              },
              grid: {
                color: "rgba(11, 79, 168, 0.08)",
                drawBorder: false
              }
            }
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: "#17324d",
              padding: 10,
              cornerRadius: 10,
              callbacks: {
                label: function (ctx) {
                  return ` ${ctx.dataset.label}: ${ctx.parsed.y}건`;
                }
              }
            }
          }
        }
      });

      categories.forEach(function (category, index) {
        const isVisible = !window.categoryTimelineState.hiddenCategories[category];
        window.categoryTimelineChart.setDatasetVisibility(index, isVisible);
      });
      window.categoryTimelineChart.update();
      syncTimelineLegendButtons();

      if (!window.__categoryTimelineLegendBound) {
        window.__categoryTimelineLegendBound = true;

          if (!category) return;

          event.preventDefault();
          window.categoryTimelineState = window.categoryTimelineState || { hiddenCategories: {} };
          const hiddenCategories = window.categoryTimelineState.hiddenCategories || {};
          hiddenCategories[category] = !hiddenCategories[category];
          window.categoryTimelineState.hiddenCategories = hiddenCategories;

          if (window.categoryTimelineChart) {
            const chartIndex = window.categoryTimelineChart.data.datasets.findIndex(function (dataset) {
              return dataset.label === category;
            });
            if (chartIndex >= 0) {
              window.categoryTimelineChart.setDatasetVisibility(chartIndex, !hiddenCategories[category]);
              window.categoryTimelineChart.update();
            }
          }

          document.querySelectorAll("[data-timeline-category-toggle]").forEach(function (item) {
            const itemCategory = item.dataset.timelineCategoryToggle || "";
            const isVisible = !hiddenCategories[itemCategory];
            item.classList.toggle("is-inactive", !isVisible);
            item.setAttribute("aria-pressed", isVisible ? "true" : "false");
          });
        });
      }

    function initDashboardRoutingOverview(root) {
      const scope = root && root.querySelector ? root : document;
      const section = scope.querySelector("[data-dashboard-routing-overview]");
      if (!section) return;

      function applyRoutingScope(nextScope) {
        const scopeName = nextScope === "all" ? "all" : "today";
        window.dashboardRoutingScope = scopeName;
        let activeTotal = 0;
        section.querySelectorAll("[data-dashboard-routing-panel]").forEach(function (panel) {
          const isActivePanel = panel.dataset.dashboardRoutingPanel === scopeName;
          panel.classList.toggle("is-hidden", !isActivePanel);
          if (isActivePanel) {
            activeTotal = Number(panel.dataset.dashboardRoutingTotal || 0);
          }
        });
        section.querySelectorAll("[data-dashboard-routing-scope]").forEach(function (button) {
          const isActive = button.dataset.dashboardRoutingScope === scopeName;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
        const totalLabel = section.querySelector("[data-dashboard-routing-scope-total]");
        if (totalLabel) {
          totalLabel.textContent = `총 ${activeTotal}건`;
        }
      }

      section.querySelectorAll("[data-dashboard-routing-scope]").forEach(function (button) {
        button.addEventListener("click", function () {
          applyRoutingScope(button.dataset.dashboardRoutingScope || "today");
        });
      });
      applyRoutingScope(window.dashboardRoutingScope || "today");

      if (!ensureDashboardChartsReady()) {
        return;
      }

      const canvas = section.querySelector("#routingOverviewChart");
      if (!canvas) return;

      if (window.routingOverviewChart) {
        window.routingOverviewChart.destroy();
        window.routingOverviewChart = null;
      }

      const labels = parseDashboardChartData(section.dataset.routeLabels, []);
      const counts = parseDashboardChartData(section.dataset.routeCounts, {});
      const palette = parseDashboardChartData(section.dataset.routePalette, []);
      const total = Number(section.dataset.routeTotal || 0);
      const data = labels.map(function (label) {
        return Number(counts[label] || 0);
      });

      window.routingOverviewChart = new Chart(canvas, {
        type: "bar",
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: palette.slice(0, labels.length),
            borderRadius: 999,
            borderSkipped: false,
            barThickness: 10,
            maxBarThickness: 10,
            categoryPercentage: 0.72,
            barPercentage: 0.92
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: "y",
          animation: false,
          layout: {
            padding: { left: 2, right: 6, top: 2, bottom: 2 }
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              callbacks: {
                label: function (ctx) {
                  const value = ctx.parsed.x || 0;
                  const pct = total ? Math.round(value / total * 100) : 0;
                  return ` ${ctx.label}: ${value}건 (${pct}%)`;
                }
              }
            }
          },
          scales: {
            x: {
              beginAtZero: true,
              display: false,
              grid: {
                display: false
              },
              ticks: {
                precision: 0,
                color: "#64748B"
              }
            },
            y: {
              grid: {
                display: false
              },
              ticks: {
                color: "#526273",
                font: {
                  size: 11,
                  weight: 700
                }
              }
            }
          }
        }
      });
    }

    function applyDashboardState(state) {
      const previous = uiSyncState.versions;
      const next = state.versions || {};
      if (previous.stats && previous.stats !== next.stats) {
        refreshFragment("/ui/stats", "#stats");
      }
      if (previous.distribution && previous.distribution !== next.distribution) {
        refreshFragment("/ui/dashboard-distribution", "#dashboardDistribution");
      }
      if (previous.category_timeline && previous.category_timeline !== next.category_timeline) {
        refreshFragment("/ui/dashboard-category-timeline", "#dashboardCategoryTimeline");
      }
      if (previous.routing_overview && previous.routing_overview !== next.routing_overview) {
        refreshFragment("/ui/dashboard-routing-overview", "#dashboardRoutingOverview");
      }
      if (previous.mail_rows && previous.mail_rows !== next.mail_rows) {
        refreshFragment(dashboardMailRowsUrl(), "#dashboardMailRows");
      }
      uiSyncState.versions = next;
    }

    function applyInboxState(state) {
      const previous = uiSyncState.versions;
      const next = state.versions || {};
      const selectedIndex = document.getElementById("selectedEmailIndex");
      const selectedUid = document.getElementById("selectedEmailUid");
      if (selectedIndex && state.selected_email_index !== null && state.selected_email_index !== undefined) {
        selectedIndex.value = String(state.selected_email_index);
      }
      if (selectedUid && state.selected_email_uid) {
        selectedUid.value = state.selected_email_uid;
      }

      if (previous.mail_rows && previous.mail_rows !== next.mail_rows) {
        refreshInboxRows();
      }
      if (previous.detail && previous.detail !== next.detail) {
        const stateUid = state.selected_email_uid || (selectedUid && selectedUid.value) || "";
        const currentUid = currentDetailUid();
        if (uiSyncState.detailRequestUid && stateUid === uiSyncState.detailRequestUid) {
          // The click request is already loading this detail; avoid a duplicate poll refresh.
        } else if (uiSyncState.detailRequestNeedsVersionSync && stateUid && stateUid === currentUid) {
          uiSyncState.detailRequestNeedsVersionSync = false;
        } else {
          refreshInboxDetail(state.selected_email_index, state.selected_email_uid);
        }
      }
      uiSyncState.versions = next;
    }

    function applyMonitoringState(state) {
      const previous = uiSyncState.versions;
      const next = state.versions || {};
      if (previous.monitoring_rows && previous.monitoring_rows !== next.monitoring_rows) {
        refreshOpsRows();
      }
      uiSyncState.versions = next;
    }

    function scheduleUiPoll(delayMs) {
      window.clearTimeout(uiSyncState.timer);
      uiSyncState.timer = window.setTimeout(runUiPoll, delayMs);
    }

    async function runUiPoll() {
      const view = currentUiView();
      if (!view) {
        scheduleUiPoll(10000);
        return;
      }

      const url = view === "dashboard"
        ? dashboardStateUrl()
        : view === "monitoring"
          ? monitoringStateUrl()
          : view === "documents"
            ? documentsStateUrl()
            : inboxStateUrl();
      try {
        const response = await fetch(url, {
          headers: { Accept: "application/json" },
          cache: "no-store",
        });
        if (!response.ok) throw new Error(`ui state ${response.status}`);
        const state = await response.json();
        if (uiSyncState.view !== view || !uiSyncState.versions || Object.keys(uiSyncState.versions).length === 0) {
          uiSyncState.view = view;
          uiSyncState.versions = state.versions || {};
        } else if (view === "dashboard") {
          applyDashboardState(state);
        } else if (view === "documents") {
          if (uiSyncState.versions.document_sections && state.versions && uiSyncState.versions.document_sections !== state.versions.document_sections) {
            const sectionsUrl = new URL("/ui/document-type-sections", window.location.origin);
            refreshFragment(sectionsUrl.toString(), "#documentTypeSections");
          }
          uiSyncState.versions = state.versions || {};
        } else if (view === "monitoring") {
          applyMonitoringState(state);
        } else {
          applyInboxState(state);
        }
      } catch (error) {
        console.warn("UI sync poll failed", error);
      } finally {
        scheduleUiPoll(view === "documents" ? 10000 : isDetailProgressActive() ? 1000 : 1500);
      }
    }

    function resetUiSync() {
      uiSyncState.view = currentUiView();
      uiSyncState.versions = {};
      scheduleUiPoll(1200);
    }

    function nudgeUiSync(delayMs) {
      uiSyncState.view = currentUiView();
      scheduleUiPoll(delayMs || 1200);
    }

    function routingChipAfterElement(list, pointerY) {
      const candidates = Array.from(list.querySelectorAll("[data-routing-assignee-chip]:not(.is-dragging)"));
      return candidates.reduce(function (closest, candidate) {
        const rect = candidate.getBoundingClientRect();
        const offset = pointerY - rect.top - rect.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: candidate };
        }
        return closest;
      }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
    }

      if (!dashboardRow) return;

      if (requestUrl.pathname !== "/ui/inbox") return;

      const activeCategory = window.categoryFilterState && window.categoryFilterState.activeCategory;
      if (!activeCategory || activeCategory === "__all__") return;
      event.detail.parameters.category = activeCategory;
    });

    document.addEventListener("DOMContentLoaded", function () {
      installResponsiveHtmxControls(document);
      installMainNavigation();
      installDemoMainNavigationCache();
      installSearchFormFallback();
      installSearchExamples();
      hydrateChatSessionInputs(document);
      limitInboxRows();
      syncInboxSelection();
      initDashboardDistribution(document);
      initDashboardCategoryTimeline(document);
      initDashboardRoutingOverview(document);
      initMonitoringColumns(document);
      initOpsInteractions(document);
      initAssigneeDetailDrawerInteractions(document);
      initChatEmailDrawerInteractions(document);
      updateMailStatusFilterButtons(document);
      updateCategoryFilterButtons(document);
      resizeEmailBodyFrames(document);
      syncDashboardViewportMode();
      resetUiSync();
      scheduleManualRoutePoll(1500);
      prefetchDemoMainViews();
      window.setInterval(checkClientVersion, 15000);
    });

    window.addEventListener("resize", limitInboxRows);
    window.addEventListener("resize", function () {
      updateMailStatusFilterButtons(document);
      updateCategoryFilterButtons(document);
    });
