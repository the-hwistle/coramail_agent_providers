[project]
name = "coramail-agent"
version = "0.1.0"
description = "Document-first CoRA Mail Agent demo application."
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi",
    "google-api-python-client",
    "google-auth-oauthlib",
    "jinja2",
    "openpyxl",
    "paddleocr>=3.7.0",
    "paddlepaddle-gpu==3.3.1",
    "paddlex[ocr]==3.7.2",
    "pillow",
    "psycopg[binary]>=3.3.4",
    "pydantic",
    "pymupdf",
    "pypdf",
    "python-docx",
    "requests",
    "uvicorn",
]

[tool.uv]
package = false

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" }

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/benchmark_llm_inference.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
