name: coramail-agent-prod

services:
  web:
    image: ${CORAMAIL_WEB_IMAGE:?set CORAMAIL_WEB_IMAGE to a tested CoRA Mail image tag}
    restart: unless-stopped
    command:
      - python
      - -m
      - uvicorn
      - app.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
    env_file:
      - ${CORAMAIL_PROD_COMPOSE_ENV_FILE:-./config/production.env}
    environment:
      CORAMAIL_DEMO_MODE: "false"
      CORAMAIL_LOCAL_DEV_DEFAULTS: "false"
      CORAMAIL_DEV_SEED_DEMO: "false"
    ports:
      - "${CORAMAIL_WEB_BIND:-127.0.0.1}:${CORAMAIL_WEB_PORT:-8000}:8000"
    volumes:
      - coramail_prod_runtime:/app/data/runtime
      - coramail_prod_paddlex_cache:/tmp/coramail-paddlex-cache
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  migrate:
    image: ${CORAMAIL_WEB_IMAGE:?set CORAMAIL_WEB_IMAGE to a tested CoRA Mail image tag}
    profiles:
      - tools
    restart: "no"
    command: >
      sh -c "python -m app.tools.apply_postgres_schema &&
      python -m app.tools.prepare_qdrant_collection"
    env_file:
      - ${CORAMAIL_PROD_COMPOSE_ENV_FILE:-./config/production.env}
    environment:
      CORAMAIL_DEMO_MODE: "false"
      CORAMAIL_LOCAL_DEV_DEFAULTS: "false"
      CORAMAIL_DEV_SEED_DEMO: "false"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres:
    image: ${CORAMAIL_POSTGRES_IMAGE:?set CORAMAIL_POSTGRES_IMAGE to a tested PostgreSQL image tag}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CORAMAIL_POSTGRES_DB:?set CORAMAIL_POSTGRES_DB}
      POSTGRES_USER: ${CORAMAIL_POSTGRES_USER:?set CORAMAIL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CORAMAIL_POSTGRES_PASSWORD:?set CORAMAIL_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - coramail_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  qdrant:
    image: ${CORAMAIL_QDRANT_IMAGE:?set CORAMAIL_QDRANT_IMAGE to a tested Qdrant image tag}
    restart: unless-stopped
    volumes:
      - coramail_prod_qdrant_data:/qdrant/storage

volumes:
  coramail_prod_postgres_data:
  coramail_prod_qdrant_data:
  coramail_prod_runtime:
  coramail_prod_paddlex_cache:
